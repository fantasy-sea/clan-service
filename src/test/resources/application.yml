spring:
  datasource:
    url: jdbc:h2:mem:clan_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

clan:
  pairing:
    hmac-key: test-pairing-hmac-key-that-is-at-least-32-bytes
  websocket:
    container-enabled: false
