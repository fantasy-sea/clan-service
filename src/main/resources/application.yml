spring:
  application:
    name: clan-service

  datasource:
    # 真实连接信息一律通过环境变量注入（MYSQL_HOST/PORT/DATABASE/USER/PASSWORD）。
    # 下列默认值仅供本地开发，严禁把真实凭据写进仓库。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:clan_service}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&tinyInt1isBit=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway only.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    # The target database is shared and already contains unrelated tables.
    # Baseline the existing schema at version 0 so V1__init.sql still applies.
    baseline-on-migrate: true
    baseline-version: 0

server:
  # 统一默认端口为 8080；可用 SERVER_PORT 环境变量覆盖。
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

clan:
  pairing:
    # Development-only fallback. application-prod.yml deliberately requires an external secret.
    hmac-key: ${PAIRING_HMAC_KEY:local-development-pairing-hmac-key-change-me}
