spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&characterEncoding=utf8&tinyInt1isBit=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

clan:
  pairing:
    hmac-key: ${PAIRING_HMAC_KEY}

server:
  forward-headers-strategy: framework
