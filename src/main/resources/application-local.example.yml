# =============================================================================
# 本机数据库连接配置模板（每台开发机一份本地配置）
# -----------------------------------------------------------------------------
# 用法：
#   1. 复制本文件为 application-local.yml（同一目录下）。
#   2. 把 your-* 占位值替换成你自己的真实数据库连接信息。
#   3. 启动时激活 local profile：
#        PowerShell:  $env:SPRING_PROFILES_ACTIVE='local'; .\mvnw.cmd spring-boot:run
#        bash/macOS:  SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
#
# 注意：
#   - application-local.yml 已被 .gitignore 忽略，永远不会上传 GitHub，
#     每台开发机各自维护，彼此不可见。
#   - 本文件（application-local.example.yml）只含假占位值，可以正常提交。
#   - local 配置会覆盖 application.yml 里的占位默认值（localhost:3306 等），
#     无需修改 application.yml 本身。
# =============================================================================
spring:
  datasource:
    url:
    username:
    password:

clan:
  pairing:
    hmac-key: replace-with-at-least-32-random-bytes
